<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>js-dos api</title>
    <style type="text/css">
      .dosbox-container { width: 640px; height: 400px; }
      .dosbox-container > .dosbox-overlay { background: url(https://js-dos.com/cdn/digger.png); }
    </style>
  </head>
  <body>
    <div id="dos" style="width: 100vw; height: 60vw;"></div>
    <br/>
    <button onclick="dos.requestFullScreen();">Make fullscreen</button>
    
    <!-- js-dos style sheet -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

    <!-- js-dos -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script>
        Dos(document.getElementById("dos"), {
            url: "https://rasteri.github.io/DontShitYourPants/DontShit.jsdos",
        });
    </script>
  </body>
</html>
